[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "exports"
module-root = ""

[project]
name = "python-exports"
version = "1.4.0.dev0"
description = "@export decorator that adds a function or class to __all__"
authors = [{ name = "Joren Hammudoglu", email = "jhammudoglu@gmail.com" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/jorenham/exports"
Documentation = "https://github.com/jorenham/exports/blob/master/README.md"
Issues = "https://github.com/jorenham/exports/issues"
Changelog = "https://github.com/jorenham/exports/releases"
Funding = "https://github.com/sponsors/jorenham"

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "basedpyright==1.40.2",
  "pyrefly==1.3.2",
  "pytest>=9.1.1",
  "ruff>=0.17.0",
  "sp-repo-review[cli]>=2026.8.14",
  "ty==0.0.86",
]

# mypy

[tool.mypy]
strict = true
strict_bytes = true
strict_concatenate = true

enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
enable_incomplete_feature = ["PreciseTupleTypes"]
disallow_any_expr = false
disallow_any_explicit = false
disallow_any_decorated = false
local_partial_types = true
warn_unreachable = false
warn_unused_ignores = true

# (based)pyright

[tool.pyright]
include = ["exports", "tests"]
exclude = [".venv"]
stubPath = "."
pythonPlatform = "All"
typeCheckingMode = "all"
reportUnusedCallResult = false # https://github.com/microsoft/pyright/issues/8650

# pyrefly

[tool.pyrefly]
project-includes = ["exports", "tests"]

# ty

[tool.ty]

[tool.ty.environment]
python-platform = "all"

[tool.ty.src]
include = ["exports", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = false # for mypy compat

[tool.ty.rules]
unused-ignore-comment = "warn"
possibly-unresolved-reference = "error"

# pytest

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra"]
testpaths = ["exports", "tests"]
filterwarnings = ["error"]
log_level = "INFO"
strict = true

# repo-review

[tool.repo-review]
ignore = ["PY004", "PY006", "RTD"]

# ruff

[tool.ruff]
src = ["exports"]
show-fixes = true
force-exclude = true
extend-exclude = [".github", ".vscode", "tests"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",
  "DOC",
  "f-string-in-exception",
  "raise-vanilla-args",
  "undocumented-public-package",
  "non-empty-init-module",
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
known-first-party = ["exports"]
lines-after-imports = 2
lines-between-types = 0
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
line-ending = "lf"
skip-magic-trailing-comma = true

# tox

[tool.tox]
min_version = "4"
requires = ["tox-uv>=1"]
env_list = [
  "3.11",
  "3.12",
  "3.13",
  "3.14",
  "3.15",
  "mypy",
  "basedpyright",
  "pyrefly",
  "ty",
  "repo-review",
  "ruff",
]

[tool.tox.env_run_base]
description = "pytest"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["pytest"]]

[tool.tox.env.mypy]
description = "mypy"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [
  [
    "mypy",
    "--no-incremental",
    "--cache-dir=/dev/null",
    { replace = "posargs", default = ["."], extend = true },
  ],
]

[tool.tox.env.basedpyright]
description = "basedpyright"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["basedpyright", { replace = "posargs", default = [], extend = true }]]

[tool.tox.env.pyrefly]
description = "pyrefly"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["pyrefly", "check", { replace = "posargs", default = [], extend = true }]]

[tool.tox.env.ty]
description = "ty"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [
  [
    "ty",
    "check",
    "--error-on-warning",
    "--output-format=concise",
    { replace = "posargs", default = [], extend = true },
  ],
]

[tool.tox.env.ruff]
description = "ruff"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [
  ["ruff", "check", "--show-fixes"],
  ["ruff", "format", "--check"],
]
