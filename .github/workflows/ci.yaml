name: CI
permissions: {}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: 1

jobs:
  lint:
    name: lint
    timeout-minutes: 1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: scientific-python/repo-review@91fa00fc79af75f7931c18f2c3f1aca660ca7b1c # v1.3.0
        with:
          plugins: sp-repo-review

      - name: dprint
        uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5

      - name: typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: ruff
        run: |
          uv run ruff check --output-format=github
          uv run ruff format --check

      - name: ty
        run: uv run ty check --error-on-warning --output-format=github

      - name: pyrefly
        run: uv run pyrefly check

      - name: basedpyright
        run: uv run basedpyright

      - name: basedpyright --verifytypes
        run: uv run basedpyright --ignoreexternal --verifytypes exports

      - name: mypy
        run: uv run mypy .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.py }})
    runs-on: ubuntu-latest
    timeout-minutes: 1

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        py: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.py }}

      - name: pytest
        run: uv run pytest
